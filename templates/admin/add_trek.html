{% extends "base.html" %}
{% block title %}Admin | Add Trek{% endblock %}

{% block content %}

<div class="card rounded d-flex mx-auto" style="margin-top: 90px; width: 500px;">
    <h3 class="card-header bg-primary text-center p-4 text-white">{% if user.role == 'Admin'%}ADD/EDIT TREK{% else %}EDIT TREK{% endif %}</h3>

    <div class="card-body container">
        <form method="post" action="{{ url_for('add_trek') }}" enctype="multipart/form-data" class="m-2">

            <div class="mb-3">
                <label for="trek_name" class="form-label">Trek Name</label>
                <input type="text" class="form-control" name="trek_name" placeholder="trek name" id="trek_name" value="{{ trek_name or ''}}" {% if user.role == 'Trek Staff' %}readonly{% endif %} required>
            </div>

            <div class="mb-3">
                <label for="location" class="form-label">Location</label>
                <input type="text" class="form-control" name="location" placeholder="Stephens Road Bangalore" id="location" value="{{ location or '' }}" {% if user.role == 'Trek Staff' %}readonly{% endif %} required>
            </div>

            <div class="mb-3">
                <label for="difficulty" class="form-label">Difficulty</label>
                <select class="form-control form-select" name="difficulty" id="difficulty" required>
                    <option value="" selected readonly>DIFFICULTY</option>
                    <option value="Easy" {% if difficulty == Easy %}selected{% endif %}>Easy</option>
                    <option value="Moderate" {% if difficulty == Moderate %}selected{% endif %}>Moderate</option>
                    <option value="Hard" {% if difficulty == Hard %}selected{% endif %}>Hard</option>
                </select>
            </div>

            <div class="mb-3">
                <label for="description" class="form-label">Description</label>
                <input type="text" class="form-control" placeholder="Description" name="description" id="description" value="{{ description }}" {% if user.role == 'Trek Staff' %}readonly{% endif %} required>
            </div>

            <div class="mb-3">
                <label for="total_slots" class="form-label">Total Slots</label>
                <input type="number" class="form-control" placeholder="total slots available" name="total_slots" id="total_slots" value="{{ total_slots }}" required>
            </div>

            <div class="mb-3">
                <label for="start_date" class="form-label">Start Date</label>
                <input type="date" class="form-control" name="start_date" id="start_date" value="{{start_date or ''}}" {% if user.role == 'Trek Staff' %}readonly{% endif %} required>
            </div>

            <div class="mb-3">
                <label for="end_date" class="form-label">End Date</label>
                <input type="date" class="form-control" name="end_date" id="end_date" value="{{end_date or ''}}" {% if user.role == 'Trek Staff' %}readonly{% endif %} required>
            </div>

            <div class="mb-3">
                <label for="meeting_point" class="form-label">Meeting Point</label>
                <input name="meeting_point" id="meeting_point" class="form-control" type="text" placeholder="Bangalore" value="{{meeting_point or ''}}" required>
            </div>

            <div class="mb-3">
                <label for="price" class="form-label">Price</label>
                <input name="price" id="price" class="form-control" type="number" placeholder="₹ ..." value="{{price or ''}}" {% if user.role == 'Trek Staff' %}readonly{% endif %} required>
            </div>

            <div class="mb-3">
                <label for="status" class="form-label">Status</label>
                <select name="status" class="form-select">
                    <option value="open" {% if status == 'Booking Open' %}selected{% endif %}>Booking Open</option>
                    <option value="closed" {% if status == 'Booking Closed'%}selected{% endif %}>Booking Closed</option>
                    <option value="started" {% if status == 'Started' %}selected{% endif %}>Started</option>
                    <option value="completed" {% if status == 'Completed' %}selected{% endif %}>Completed</option>
                </select>
            </div>
            {% if user.role == 'Admin' %}
            <div class="mb-3">
                <label for="staff_id" class="form-label {% if user.role == 'Trek Staff' %}d-none{% endif %}">Staff ID</label>
                <select class="form-select form-control" name="staff_id" id="staff_id">
                    <option value="" selected disabled>SELECT STAFF</option>
                    {% for staff in staffs %}
                    <option value="{{staff.id}}" {% if staff_id == staff.id %}selected{% endif %}>{{staff.f_name + " " + staff.l_name}}</option>
                    {% endfor %}
                </select>
            </div>
            {% endif %}

            <div class="mb-3">
                <label for="image" class="form-label">Trek Image</label>
                <input type="file" name="image" class="form-control" id="image" accept="image/*">
            </div>

            {% if error %}
                <div class="alert alert-danger">{{ error }}</div>
            {% endif %}
            <div class="d-flex">
                <button type="submit" class="btn btn-success m-2">{% if current_page == "add_trek" %}ADD{% else %}Change{% endif %}</button>
                <a {% if user.role == 'Admin' %}href="{{ url_for('add_edit_treks' )}}"{% else %}href="{{ url_for('my_treks')}}"{% endif %} class="m-2 btn btn-primary text-white ms-auto rounded">Go Back</a>
            </div>
        </form>
    </div>
</div>

{% endblock %}
