<!DOCTYPE html>
<html>
    <head>
        <title>Login | Admin </title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    </head>

    

    <body class="bg-dark text-white">
        <header class="border-bottom border-white text-white bg-opacity-95">
            <h5 class="m-3">Trekking Management Application</h5>
        </header>

        <main class="container d-flex card justify-content-center p-4" style="max-width: 500px; margin-top: 7rem;">

            <div class="border-bottom m-2">
                <h4 class="m-4 p-4 text-center">Admin</h4>
            </div>

            <form action="{{ url_for('login_admin') }}" method="post" class="m-4">
                
                <div class="mb-3">
                    <label class="form-label" for="username">User</label>
                    <input type="text" class="form-control" id="username" name="username" placeholder="username or email" value="{{ username or ''}}" required>
                </div>

                <div class="mb-3">
                    <label class="form-label" for="password">Password</label>
                    <input type="password" class="form-control" id="password" name="password" placeholder="password" required>
                </div>

                <div class="container d-grid">
                    <button type="submit" class="btn btn-primary m-3">
                        Login
                    </button>
                </div>

                {% if error %}
                    <div class="alert alert-danger m-2 mb-3">
                        {{ error }}
                    </div>
                {% endif %}

                {% if success %}
                    <div class="alert alert-success">
                        {{ success }}
                    </div>
                {% endif %}

                <div class="m-2 container row">
                    <p class="col">User ? 
                        <a class="link-offset-2 link-primary" href="{{ url_for('login') }}">Login</a>
                    </p>

                    <p class="col">New user ?
                        <a class="link-offset-2 link-primary" href="{{ url_for('register') }}">Register</a>
                    </p>
                </div>

            </form>
        </main>
    </body>
</html>
