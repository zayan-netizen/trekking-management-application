<!DOCTYPE html>
<html>
<head>
    <title>Login | Trekking Management Application</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-dark text-white">

    <header class="border-bottom border-white">
        <h5 class="m-3 text-white">
            Trekking Management Application
        </h5>
    </header>

    <main class="container d-flex justify-content-center" style="margin-top: 7rem;">

        <div class="card p-4" style="width: 500px;">
            <h2 class="text-center m-4">Sign in</h2>

            <form action="{{ url_for('login') }}" method="POST">

                <div class="mb-3">
                    <label for="username" class="form-label">User</label>

                    <input
                        type="text"
                        class="form-control"
                        id="username"
                        name="username"
                        placeholder="Username or Email"
                        value="{{ username or '' }}"
                        required
                    >
                </div>

                <div class="mb-3">
                    <label for="password" class="form-label">Password</label>

                    <input
                        type="password"
                        class="form-control"
                        id="password"
                        name="password"
                        placeholder="Password"
                        required
                    >
                </div>

                <div class="container mt-3 d-grid">
                    <button type="submit" class="btn btn-success p-2 m-4">
                        Login
                    </button>
                </div>
                
            </form>

            {% if error %}
                <div class="alert alert-danger p-2 m-2">
                    {{ error }}
                </div>
            {% endif %}

                
            {% if success %}
                <div class="alert alert-success p-2">
                    {{ success }}
                </div>
            {% endif %}
            <hr>
            
            <div class="container text-center">
                <div class="row p-3">

                    <div class="col">
                        <p class="text-center mb-0">
                            Don't have an account?
                        </p>

                        <a href="{{ url_for('register') }}" class="link-primary link-offset-2">
                            Register
                        </a>
                    </div>
            
                    <div class="col">
                        <p class="text-center mb-0">
                            Admin?
                        </p>

                        <a href="{{ url_for('login_admin') }}" class="link-primary link-offset-2">
                            Click Here
                        </a>
                    </div>

                </div>
            </div>
        </div>

    </main>

</body>
</html>
