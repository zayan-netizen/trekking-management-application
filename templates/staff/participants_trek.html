{% extends "base.html" %}
{% block content %}

<div>
    <div class="text-white rounded m-5">
        <h2 class="m-5 rounded text-center">Participants For ({{ trek.trek_name }})</h2>
    </div>

    <div class="m-5 table-responsive">
        <table class="table table-dark table-hover align-middle">
            <thead class="table-dark">
                <tr>
                    <th>Name</th>
                    <th>Contact No.</th>
                    <th>Payment Status</th>
                    <th>Action</th>
                </tr>
            </thead>

            <tbody>
                {% for booking in bookings %}
                <tr>
                    <td>{{booking.user.f_name}} {{booking.user.l_name}}</td>
                    <td>{{booking.user.phone}}</td>
                    <td>{{booking.payment_status}}</td>
                    <td><form method="post" action="{{url_for('remove_booking', booking_id=booking.booking_number)}}">
            <button class="btn btn-danger ms-auto">Remove Participant</button>
            </form></td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
        <a href="{{url_for('my_treks')}}" class="btn btn-primary">Go Back</a>
    </div>
</div>

{% endblock %}
